        New England journal of medicine</Title><ISOAbbreviation>N Engl J Med</ISOAbbreviation></Journal><ArticleTitle>Remdesivir
        for the Treatment of Covid-19 - Final Report.</ArticleTitle><Pagination><StartPage>1813</StartPage><EndPage>1826</EndPage><MedlinePgn>1813-1826</MedlinePgn></Pagination><ELocationID
        EIdType="pii" ValidYN="Y">NEJMoa2007764</ELocationID><ELocationID EIdType="doi"
        ValidYN="Y">10.1056/NEJMoa2007764</ELocationID><Abstract><AbstractText Label="BACKGROUND">Although
        several therapeutic agents have been evaluated for the treatment of coronavirus
        disease 2019 (Covid-19), no antiviral agents have yet been shown to be efficacious.</AbstractText><AbstractText
        Label="METHODS">We conducted a double-blind, randomized, placebo-controlled
        trial of intravenous remdesivir in adults who were hospitalized with Covid-19
        and had evidence of lower respiratory tract infection. Patients were randomly
        assigned to receive either remdesivir (200 mg loading dose on day 1, followed
        by 100 mg daily for up to 9 additional days) or placebo for up to 10 days.
        The primary outcome was the time to recovery, defined by either discharge
        from the hospital or hospitalization for infection-control purposes only.</AbstractText><AbstractText
        Label="RESULTS">A total of 1062 patients underwent randomization (with 541
        assigned to remdesivir and 521 to placebo). Those who received remdesivir
        had a median recovery time of 10 days (95% confidence interval [CI], 9 to
        11), as compared with 15 days (95% CI, 13 to 18) among those who received
        placebo (rate ratio for recovery, 1.29; 95% CI, 1.12 to 1.49; P&lt;0.001,
        by a log-rank test). In an analysis that used a proportional-odds model with
        an eight-category ordinal scale, the patients who received remdesivir were
        found to be more likely than those who received placebo to have clinical improvement
        at day 15 (odds ratio, 1.5; 95% CI, 1.2 to 1.9, after adjustment for actual
        disease severity). The Kaplan-Meier estimates of mortality were 6.7% with
        remdesivir and 11.9% with placebo by day 15 and 11.4% with remdesivir and
        15.2% with placebo by day 29 (hazard ratio, 0.73; 95% CI, 0.52 to 1.03). Serious
        adverse events were reported in 131 of the 532 patients who received remdesivir
        (24.6%) and in 163 of the 516 patients who received placebo (31.6%).</AbstractText><AbstractText
        Label="CONCLUSIONS">Our data show that remdesivir was superior to placebo
        in shortening the time to recovery in adults who were hospitalized with Covid-19
        and had evidence of lower respiratory tract infection. (Funded by the National
        Institute of Allergy and Infectious Diseases and others; ACTT-1 ClinicalTrials.gov
        number, NCT04280705.).</AbstractText><CopyrightInformation>Copyright &#xa9;
        2020 Massachusetts Medical Society.</CopyrightInformation></Abstract><AuthorList
